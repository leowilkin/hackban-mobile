name: Hackban
options:
  bundleIdPrefix: com.hackclub
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    # Set your team to run on a device (App Groups + Keychain sharing need signing).
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_EMIT_LOC_STRINGS: NO
    SWIFT_ENABLE_BARE_SLASH_REGEX: YES

targets:
  Hackban:
    type: application
    platform: iOS
    sources:
      - path: Hackban
      - path: HackbanKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hackclub.hackban
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        GENERATE_INFOPLIST_FILE: YES
    info:
      path: Hackban/Info.plist
      properties:
        CFBundleDisplayName: Hackban
        UILaunchScreen: {}
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        HBKeychainGroup: $(AppIdentifierPrefix)com.hackclub.hackban.shared
        HBAppGroup: group.com.hackclub.hackban
        NSUserActivityTypes: [com.hackclub.hackban.quickadd]
        BGTaskSchedulerPermittedIdentifiers: [com.hackclub.hackban.refresh]
        UIBackgroundModes: [fetch]
        CFBundleURLTypes:
          - CFBundleURLName: com.hackclub.hackban
            CFBundleURLSchemes: [hackban-ios]
    entitlements:
      path: Hackban/Hackban.entitlements
      properties:
        com.apple.security.application-groups: [group.com.hackclub.hackban]
        keychain-access-groups: [$(AppIdentifierPrefix)com.hackclub.hackban.shared]
    dependencies:
      - target: HackbanWidgets
        embed: true

  HackbanWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: HackbanWidgets
      - path: HackbanKit
        excludes:
          - "UI/AuthImage.swift"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hackclub.hackban.widgets
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) WIDGET_EXTENSION
    info:
      path: HackbanWidgets/Info.plist
      properties:
        CFBundleDisplayName: Hackban
        HBKeychainGroup: $(AppIdentifierPrefix)com.hackclub.hackban.shared
        HBAppGroup: group.com.hackclub.hackban
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: HackbanWidgets/HackbanWidgets.entitlements
      properties:
        com.apple.security.application-groups: [group.com.hackclub.hackban]
        keychain-access-groups: [$(AppIdentifierPrefix)com.hackclub.hackban.shared]

  HackbanTests:
    type: bundle.unit-test
    platform: iOS
    sources: [HackbanTests]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hackclub.hackban.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Hackban.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Hackban
        BUNDLE_LOADER: $(TEST_HOST)
    dependencies:
      - target: Hackban

schemes:
  Hackban:
    build:
      targets:
        Hackban: all
        HackbanWidgets: all
    test:
      targets: [HackbanTests]
    run:
      config: Debug
