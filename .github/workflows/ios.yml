name: iOS

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 26
        run: |
          XC=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$XC" ]; then sudo xcode-select -s "$XC"; fi
          xcodebuild -version
      - name: Generate project
        run: |
          brew install xcodegen
          xcodegen generate
      - name: Pick simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; c=[x for k,v in d.items() if "iOS" in k for x in v if x["name"].startswith("iPhone")]; print(c[-1]["udid"])')
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
      - name: Build
        timeout-minutes: 25
        run: |
          set -o pipefail
          xcodebuild build-for-testing \
            -project Hackban.xcodeproj -scheme Hackban \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            OTHER_SWIFT_FLAGS='$(inherited) -Xfrontend -warn-long-expression-type-checking=400 -Xfrontend -warn-long-function-bodies=600' \
            > build.log 2>&1 || { grep -E "error:" build.log | sort -u | head -200; tail -40 build.log; exit 1; }
          grep -E "warning: (expression|instance method|getter|global function|initializer).*took" build.log | sort -u | head -40 || true
          grep -E "\*\* (BUILD|TEST BUILD)" build.log || true
      - name: Test
        timeout-minutes: 15
        run: |
          set -o pipefail
          xcodebuild test-without-building \
            -project Hackban.xcodeproj -scheme Hackban \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            > test.log 2>&1 || { grep -E "error|failed|Test Case.*failed" test.log | head -100; tail -60 test.log; exit 1; }
          grep -E "Test Case|Executed|\*\* TEST" test.log | tail -40
